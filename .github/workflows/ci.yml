name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # The [dev] extra pulls pytest + ruff; httpx (TestClient) is a runtime dep.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # The two live-Postgres tests skip without EIYE_TEST_PG_DSN, so a green
      # run here does not exercise the Postgres connector against a real server.
      - name: Test
        run: pytest -q
