name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend

    # Both servers, one job, different ports. The MySQL connector's read-only
    # guarantee is not something unit tests can assert — START TRANSACTION READ
    # ONLY not covering DDL, and the driver refusing multi-statement, are
    # server behaviours. And "MariaDB is a dialect, not a second SKU" is only
    # honest if something exercises MariaDB.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: eiye
          MYSQL_DATABASE: t
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -peiye"
          --health-interval=5s --health-timeout=5s --health-retries=20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: eiye
          MARIADB_DATABASE: t
        ports: ["3307:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      # Runs natively here. It cannot run locally on Apple Silicon — the amd64
      # image dies under emulation with "Invalid mapping of address ... in
      # reserved address space" — so developers use ARM-native Azure SQL Edge
      # and this job is the authoritative check against the real engine.
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "eiyeTest!2026"
          MSSQL_PID: Developer
        ports: ["1433:1433"]
      # Oracle Database Free: free-use terms, no licence key, multi-platform so
      # it also runs locally on Apple Silicon (unlike SQL Server). This is the
      # reason Oracle was built before Confluence Data Center, which has no
      # official image and needs a licence Atlassian stopped self-serving in
      # March 2026 — a connector whose read-only claim cannot be tested against
      # a real server is a claim resting on skipped tests.
      oracle:
        image: gvenzl/oracle-free:slim
        env:
          ORACLE_PASSWORD: eiye
        ports: ["1521:1521"]
        options: >-
          --health-cmd="healthcheck.sh"
          --health-interval=10s --health-timeout=5s --health-retries=30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # [dev] pulls pytest + ruff; [mysql] pulls the connector's driver, which
      # is an optional extra so a deployment installs only what it connects to.
      # httpx (TestClient) is a runtime dep.
      - name: Install
        run: pip install -e ".[dev,mysql,mssql,s3,oracle]"

      - name: Lint
        run: ruff check .

      # SQL Server only ships the `master` database, and it takes tens of
      # seconds to accept logins. Poll rather than guess a sleep; the MySQL and
      # MariaDB images create their database from env and have health checks,
      # so only this one needs the step.
      - name: Create the SQL Server test database
        run: |
          python - <<'PY'
          import time

          import pymssql

          for _attempt in range(36):
              try:
                  conn = pymssql.connect(server="127.0.0.1", user="sa", password="eiyeTest!2026", autocommit=True)
                  break
              except pymssql.Error:
                  time.sleep(5)
          else:
              raise SystemExit("SQL Server never became reachable")
          conn.cursor().execute("IF DB_ID('eiyetest') IS NULL CREATE DATABASE eiyetest")
          conn.close()
          PY

      # Not a service container: the MinIO image takes `server /data` as its
      # command, and `services:` has no field for one — only `options`, which
      # docker applies before the image's arguments.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO never became reachable" && docker logs minio && exit 1

      # MySQL, MariaDB, SQL Server, Oracle and MinIO run against the servers
      # above.
      # The live Postgres tests still skip — EIYE_TEST_PG_DSN is unset — so a
      # green run does not exercise the Postgres connector against a real server.
      # SQLite needs no variable: its "server" is a file each test creates.
      - name: Test
        env:
          EIYE_TEST_MYSQL_DSN: mysql://root:eiye@127.0.0.1:3306/t
          EIYE_TEST_MARIADB_DSN: mysql://root:eiye@127.0.0.1:3307/t
          EIYE_TEST_MSSQL_DSN: sqlserver://sa:eiyeTest%212026@127.0.0.1:1433/eiyetest
          EIYE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          EIYE_TEST_ORACLE_DSN: oracle://system:eiye@127.0.0.1:1521/FREEPDB1
        run: pytest -q
