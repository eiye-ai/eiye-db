[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eiye-db"
version = "0.1.0"
description = "Semantic Surface for AI-Ready Organizations"
license = {text = "BUSL-1.1"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "httpx>=0.27.2",
    # Capped at v1 deliberately. mcp 2.x renamed FastMCP to MCPServer and changed
    # other APIs, so mcp_server.py does not import under it. Migrating is real
    # work with its own review; until then an unpinned floor just means a fresh
    # install (CI, a new clone) silently breaks. Local dev is on 1.28.1.
    "mcp>=1.0.0,<2",
    "pypdf>=5.0.0",
    "openpyxl>=3.1.0",
    "defusedxml>=0.7.1",
    # Ed25519 verification for license files. Already present transitively, but
    # declared because license.py imports it directly. The stdlib has no
    # asymmetric signature primitive, and an HMAC scheme would require shipping
    # the signing secret to every deployment — which is precisely what must not
    # happen, since anyone holding it could mint licenses.
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.6.0"]
# Name/location redaction. Also run: python -m spacy download en_core_web_sm
ner = ["spacy>=3.7.0,<4.0.0"]
# Optional LLM assist for NL->governed-query (EIYE_NL_LLM_ENABLED=true).
# Floor: output_config (structured outputs) first appears in SDK 0.77.0.
nl = ["anthropic>=0.77.0"]

[project.scripts]
eiye-db = "eiye_db.main:main"
eiye-db-mcp = "eiye_db.mcp_server:main"

[tool.setuptools.packages.find]
include = ["eiye_db*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Pin the rule set explicitly rather than inheriting ruff's default selection,
# which changes between releases: 0.15 defaults to E4/E7/E9/F, 0.16 widened it,
# so identical code passed locally and failed CI on a newer ruff. Selecting
# explicitly makes the gate mean the same thing on every machine, and widening
# it a deliberate decision instead of a side effect of an upgrade.
select = ["E4", "E7", "E9", "F"]
# B008 (function call in argument default) can never be enabled here: FastAPI's
# dependency injection *requires* `= Depends(...)` in the signature. It fires on
# all 27 route handlers.
ignore = ["B008"]
